<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
      <section class="invoice-list-wrapper">
        <div class="card">
          <div class="row">
            <div class="col-md-6 col-12">
              <div class="d-flex justify-content-between align-items-center m-1">
                <div class="d-flex align-items-center">
                  <label class="d-flex align-items-center"
                    >Mostrar
                    <select
                      class="form-control mx-25"
                      [(ngModel)]="page.size"
                      (change)="onPageSizeChange()"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </label>
                  <button
                    type="button"
                    class="btn btn-primary ml-2"
                    (click)="open(content)"
                    rippleEffect
                  >
                    Asociar destinatario
                  </button>
                  <button
                    *ngIf="!nuevocliente"
                    type="button"
                    class="btn btn-primary ml-2"
                    (click)="open(content2)"
                    rippleEffect
                  >
                    + Nuevo destinatario
                  </button>
                </div>
              </div>
            </div>
            <div
              class="col-md-6 col-lg-4 col-12 d-flex justify-content-start justify-content-md-end align-items-center offset-lg-2"
            >
              <div class="row pb-1 pb-md-0 align-items-center w-100">
                <div class="col-10 col-md-6 pr-0">
                  <label class="d-flex align-items-center mb-0 ml-1 ml-md-0"
                    ><input
                      [(ngModel)]="searchValue"
                      name="searchValue"
                      type="search"
                      class="form-control"
                      placeholder="Buscar..."
                      (keyup)="filterUpdate($event)"
                      (search)="filterUpdate($event)"
                  /></label>
                </div>
              </div>
            </div>
          </div>
          <ngx-datatable
            [rows]="rows"
            rowHeight="auto"
            class="bootstrap core-bootstrap"
            [limit]="selectedOption"
            [columnMode]="ColumnMode.force"
            [headerHeight]="50"
            [footerHeight]="50"
            [scrollbarH]="true"
            [limit]="page.size"
            [externalPaging]="true"
            [count]="page.count"
            [offset]="page.offset"
            (page)="onPage($event)"
          >
            <ngx-datatable-column name="Destinatario" prop="destinatario" [width]="125">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <div>
                  {{ row.expand.destinatario.nombre }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            
            
            <ngx-datatable-column name="Acciones" [width]="40" [sortable]="false">
              <ng-template ngx-datatable-cell-template let-row="row">
                <div class="d-flex align-items-center col-actions">
                  
                  <a
                    class="mr-1"
                    href="javascript:void(0)"
                    (click)="ConfirmDeleteOpen(row.id)"
                    container="body"
                    placement="top"
                    ngbTooltip="Eliminar"
                    ><i size="18" data-feather="trash"></i
                  ></a>
                </div>
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </section>
    </div>
</div>
<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="myModalLabel1">Elegir destinatario</h4>
    <button type="button" class="close" (click)="cerrarModal(modal)" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body" tabindex="0" ngbAutofocus>
    <app-modaldestinatario (destinatarioEvent)="asociarNuevoCliente($event)" [nuevocliente] = "nuevocliente" [cliente]="idCliente"></app-modaldestinatario>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="cerrarModal(modal)" rippleEffect>
      Cerrar
    </button>
  </div>
</ng-template>
<ng-template #content2 let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="myModalLabel1">Nuevo destinatario</h4>
    <button type="button" class="close" (click)="cerrarModal(modal)" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body" tabindex="0" ngbAutofocus>
    <app-modalnuevodest [nuevocliente] = "nuevocliente" [cliente]="idCliente"></app-modalnuevodest>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="cerrarModal(modal)" rippleEffect>
      Cerrar
    </button>
  </div>
</ng-template>
