<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <section class="invoice-list-wrapper">
      <div class="mb-1" style="color: #e04141; font-weight: 600; font-size: 20px">
        Destinatarios
      </div>
      <div class="card">
        <div class="row">
          <div class="col-3">
            <div class="d-flex justify-content-between align-items-center m-1">
              <div class="d-flex align-items-center">
                <label class="d-flex align-items-center">Mostrar
                  <select class="form-control mx-25" [(ngModel)]="page.size" (change)="onPageSizeChange()">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                  </select>
                </label>

              </div>
            </div>
          </div>
          <div class="col-3">
            <label class="d-flex align-items-center mb-0 ml-1 ml-md-0"><input [(ngModel)]="searchValue"
                name="searchValue" type="search" class="form-control" placeholder="Escribe el nombre..." /></label>
          </div>
          <div class="col-3">
            <button class="btn btn-secondary " (click)="filterUpdate($event)">
              Buscar
            </button>
          </div>
        </div>
        <div *ngIf="cargando">
          <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
          </div>
        </div>
        <div *ngIf="!cargando">
          <ngx-datatable [rows]="rows" rowHeight="auto" class="bootstrap core-bootstrap" [limit]="selectedOption"
            [columnMode]="ColumnMode.force" [headerHeight]="50" [footerHeight]="50" [scrollbarH]="true"
            [limit]="page.size" [externalPaging]="true" [count]="page.count" [offset]="page.offset"
            (page)="onPage($event)">
            <ngx-datatable-column name="Nombre" prop="nombre" [width]="125">
              <ng-template let-nombre="value" ngx-datatable-cell-template>
                <div>
                  {{ nombre }}
                </div>
              </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Acciones" [width]="40" [sortable]="false">
              <ng-template ngx-datatable-cell-template let-row="row">
                <div class="d-flex align-items-center col-actions">
                  <button class="btn btn-outline-secondary" (click)="ConfirmGuardarDestinatario(row.id)">+</button>
                </div>
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </section>
  </div>
</div>
