<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
      <section class="invoice-list-wrapper">
        <div
          class="mb-1"
          style="color: #e04141; font-weight: 600; font-size: 20px"
        >
          Tarifario de clientes
        </div>
        <div class="card">
          <div class="row">
            <div class="col-md-6 col-12">
              <div class="d-flex justify-content-between align-items-center m-1">
                <div class="d-flex align-items-center">
                  <label class="d-flex align-items-center"
                    >Mostrar
                    <select
                      class="form-control mx-25"
                      [(ngModel)]="page.size"
                      (change)="onPageSizeChange()"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </label>
                  <button
                    class="btn btn-primary ml-2"
                    routerLink="/tarifario/clientes/add/0"
                    rippleEffect
                  >
                    Agregar
                  </button>
                  
                  <button
                    class="btn btn-primary ml-2"
                    (click) = "exportarTarifarioVigente()"
                    rippleEffect
                  >
                    Exportar tarifario vigente
                  </button>
                </div>
              </div>
            </div>
            <div
              class="col-md-6 col-lg-4 col-12 d-flex justify-content-start justify-content-md-end align-items-center offset-lg-2"
            >
              <div class="row pb-1 pb-md-0 align-items-center w-100">
                <div class="col-10 col-md-6 pr-0">
                  <label class="d-flex align-items-center mb-0 ml-1 ml-md-0"
                    ><input
                      [(ngModel)]="searchValue"
                      name="searchValue"
                      type="search"
                      class="form-control"
                      placeholder="Buscar..."
                      (keyup)="filterUpdateKeyUp($event)"
                      (search)="filterUpdate($event)"
                  /></label>
                </div>
              </div>
            </div>
          </div>
          <ngx-datatable
            [rows]="rows"
            rowHeight="auto"
            class="bootstrap core-bootstrap"
            [columnMode]="ColumnMode.force"
            [headerHeight]="50"
            [footerHeight]="50"
            [scrollbarH]="true"
            [limit]="page.size"
            [externalPaging]="true"
            [count]="page.count"
            [offset]="page.offset"
            (page)="onPage($event)"
          >
            <ngx-datatable-column
              name="Cliente"
              prop="expand.cliente.nombre"
              [width]="100"
            >
              <ng-template let-row="row" ngx-datatable-cell-template>
                <div>
                  {{ row.expand?.cliente?.nombre }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column prop="programado" name="Prog" [width]="40" [sortable]="false">
              <ng-template let-programado="value" ngx-datatable-cell-template>
                <div>
                  {{programado?"Sí":"No"}}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column prop="precio" name="Precio" [width]="40" [sortable]="false">
              <ng-template let-precio="value" ngx-datatable-cell-template>
                <div>
                  {{precio}}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
              name="Unidad"
              prop="expand.unidad.nombre"
              [width]="60"
            >
              <ng-template let-row="row" ngx-datatable-cell-template>
                <div>
                  {{ row.expand?.unidad?.nombre }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column prop="descripcion" name="Descripcion" [width]="125" [sortable]="false">
              <ng-template let-descripcion="value" ngx-datatable-cell-template>
                <div>
                  {{descripcion}}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column prop="fechadesde" name="Fecha Desde" [width]="50" >
              <ng-template let-fechadesde="value" ngx-datatable-cell-template>
                <div>
                  {{fechadesde | date : "dd/MM/yyyy"}}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column prop="fechahasta" name="Fecha Hasta" [width]="50">
              <ng-template let-fechahasta="value" ngx-datatable-cell-template>
                <div>
                  {{fechahasta | date : "dd/MM/yyyy"}}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Acciones" [width]="40" [sortable]="false">
              <ng-template ngx-datatable-cell-template let-row="row">
                <a
                  class="mr-1"
                  routerLink="/tarifario/clientes/edit/{{ row.id }}"
                  container="body"
                  placement="top"
                  ngbTooltip="Editar"
                  ><i size="18" data-feather="edit"></i
                ></a>

                <a
                  class="mr-1"
                  href="javascript:void(0)"
                  (click)="ConfirmDeleteOpen(row.id)"
                  container="body"
                  placement="top"
                  ngbTooltip="Eliminar"
                  ><i size="18" data-feather="trash"></i
                ></a>
              </ng-template>

            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </section>
    </div>
</div>
