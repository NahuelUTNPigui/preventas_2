<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <section class="invoice-add-wrapper">
      <div
      class="mb-1"
      style="color: #e04141; font-weight: 600; font-size: 20px"
    >
      Editar remitente
    </div>
      <div class="row invoice-add">
        <div class="col-xl-12 col-md-12 col-12">
          <form class="form-horizontal" #RemitenteForm="ngForm" (ngSubmit) = "onSubmit(RemitenteForm.form.valid)"> 
          <div class="card invoice-preview-card">
            
            <div class="m-0 ml-3 mr-3 ">
                <div class="row mt-1">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="nombre">Nombre</label>
                      <input 
                        class="form-control" 
                        [class.error]="RemitenteForm.submitted && nombreRef.invalid"
                        [(ngModel)]="nombre"
                        #nombreRef="ngModel"
                        required
                        id="nombre"
                        name="nombre"   
                      />
                      <span *ngIf="RemitenteForm.submitted && nombreRef.invalid" class="invalid-form">
                        <small class="form-text text-danger" *ngIf="nombreRef.errors.required"
                          >Ingrese nombre.</small
                        ></span>
                    </div>
                  </div>
                </div>   
                <!-- <div class="row mt-1">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="cliente">Cliente</label>
                      <ng-select
                        [(ngModel)]="cliente"
                        [ngClass]="{ 'error': RemitenteForm.submitted && clienteRef.invalid }"
                        required
                        id="cliente"
                        name="cliente"
                        #clienteRef="ngModel"
                      >
                        <ng-option *ngFor="let option of clienteOptions" [value]="option.id">
                          {{ option.nombre }}
                        </ng-option>
                      </ng-select>
                      <span *ngIf="RemitenteForm.submitted && clienteRef.invalid" class="invalid-form">
                        <small class="form-text text-danger" *ngIf="clienteRef.errors.required">Seleccione cliente.</small>
                      </span>
                    </div>
                  </div>
                </div> -->
                <div class="row mt-1">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="observacion">Observación</label>
                      <input 
                        class="form-control" 
                        [class.error]="RemitenteForm.submitted && observacionRef.invalid"
                        [(ngModel)]="observacion"
                        #observacionRef="ngModel"
                        id="observacion"
                        name="observacion"   
                      />
                      <!-- <span *ngIf="RemitenteForm.submitted && observacionRef.invalid" class="invalid-form">
                        <small class="form-text text-danger" *ngIf="observacionRef.errors.required"
                          >Ingrese observación.</small>
                      </span> -->
                    </div>
                  </div>
                </div>    
                <div class="m-0 ml-3 mr-3" >
                  <div class="row mt-1">
                    <div class="col-12">
                      <h4 class="text-primary invoice-logo">Clientes</h4>
                      <app-tablaclientes [idRemitente]="idRemitente" [accion]="'edit'"></app-tablaclientes>
                    </div>
                  </div>
                </div>

            </div>                     
            <div class="col-12 d-flex flex-sm-row flex-column mt-3 m-6 mb-2 justify-content-end">
              <button type="submit" class="btn btn-primary mb-1 mb-sm-0 mr-0 mr-sm-1" rippleEffect>
               Editar
              </button>
              <button type="button" class="btn btn-outline-secondary" 
              routerLink="/remitentes" rippleEffect>
                Cancelar
              </button>                  
            </div>
          </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</div>
