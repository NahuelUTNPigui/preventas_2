<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
      <section class="invoice-list-wrapper">
        <div
          class="mb-1"
          style="color: #e04141; font-weight: 600; font-size: 20px"
        >
          Destinatarios
        </div>
        <div class="card">
          <div class="row">
            <div class="col-6">
              <div class="d-flex justify-content-between align-items-center m-1">
                <div class="d-flex align-items-center">
                  <label class="d-flex align-items-center"
                    >Mostrar
                    <select
                      class="form-control mx-25"
                      [(ngModel)]="page.size"
                      (change)="onPageSizeChange()"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </label>
                  <button
                    class="btn btn-primary ml-2"
                    routerLink="/destinatarios/detalledestinatario/add/0"
                    rippleEffect
                  >
                    + Agregar
                  </button>
                  <div class="px-2">
                    <a
                      (click)="exportarXLSX()"
                      class="btn btn-outline-secondary float-right"
                      rippleEffect
                      >Exportar</a
                    >
                
                  </div>
                  <div class="hidden px-2">
                    <a
                      (click)="modalImportarOpen(modalImportar)"
                      class="btn btn-outline-secondary float-right"
                      rippleEffect
                      >Importar</a
                    >
                
                  </div>
                </div>
              </div>
            </div>
            <div
              class="col-3 d-flex justify-content-start justify-content-md-end align-items-center"
            >
              <div class="row pb-1 pb-md-0 align-items-center w-100">
                <div class="col-10 pr-0">
                  <label class="d-flex align-items-center mb-0 ml-1 ml-md-0"
                    ><input
                      [(ngModel)]="searchValue"
                      name="searchValue"
                      type="search"
                      class="form-control"
                      placeholder="Nombre..."
                      (keyup)="filterUpdateKeyUp($event)"
                      (search)="filterUpdate($event)"
                  /></label>
                </div>
              </div>
            </div>
            <div
              class="col-3 d-flex justify-content-start justify-content-md-end align-items-center"
            >
              <div class="row pb-1 pb-md-0 align-items-center w-100">
                <div class="col-10 pr-0">
                  <label class="d-flex align-items-center mb-0 ml-1 ml-md-0"
                    ><input
                      [(ngModel)]="direccion"
                      name="searchValue"
                      type="search"
                      class="form-control"
                      placeholder="Direccion..."
                      (keyup)="filterUpdateKeyUp($event)"
                      (search)="filterUpdate($event)"
                  /></label>
                </div>
              </div>
            </div>
          </div>
          <ngx-datatable
            [rows]="rows"
            rowHeight="auto"
            class="bootstrap core-bootstrap"
            [limit]="selectedOption"
            [columnMode]="ColumnMode.force"
            [headerHeight]="50"
            [footerHeight]="50"
            [scrollbarH]="true"
            [limit]="page.size"
            [externalPaging]="true"
            [count]="page.count"
            [offset]="page.offset"
            (page)="onPage($event)"
          >
            <ngx-datatable-column name="Import" prop="importancia" [width]="25">
              <ng-template let-importancia="value" ngx-datatable-cell-template>
                <div>
                  {{ importancia==1?"Alta":"Normal" }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Nombre" prop="nombre" [width]="125">
              <ng-template let-nombre="value" ngx-datatable-cell-template>
                <div>
                  {{ nombre }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Horarios" prop="horarios" [width]="125">
              <ng-template let-horarios="value" ngx-datatable-cell-template>
                <div>
                  {{ horarios }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
            name="Localidad"
            prop="expand.localidad.nombre"
            [width]="125"
          >
            <ng-template let-row="row" ngx-datatable-cell-template>
              <div>
                {{ row.expand?.localidad?.nombre }}
              </div>
            </ng-template>
          </ngx-datatable-column>
            <ngx-datatable-column
              name="Dirección"
              prop="direccion"
              [width]="125"
            >
              <ng-template let-direccion="value" ngx-datatable-cell-template>
                <div>
                  {{ direccion }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
              name="Observaciones"
              prop="observaciones"
              [width]="125"
            >
              <ng-template let-observaciones="value" ngx-datatable-cell-template>
                <div>
                  {{ observaciones }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Acciones" [width]="40" [sortable]="false">
              <ng-template ngx-datatable-cell-template let-row="row">
                <div class="d-flex align-items-center col-actions">
                  <a
                    class="mr-1"
                    routerLink="/destinatarios/detalledestinatario/ver/{{ row.id }}"
                    container="body"
                    placement="top"
                    ngbTooltip="Ver"
                    ><i size="18" data-feather="eye"></i
                  ></a>
                  <a
                    class="mr-1"
                    routerLink="/destinatarios/detalledestinatario/edit/{{ row.id }}"
                    container="body"
                    placement="top"
                    ngbTooltip="Editar"
                    ><i size="18" data-feather="edit"></i
                  ></a>
                  <a
                    class="mr-1"
                    href="javascript:void(0)"
                    (click)="ConfirmDeleteOpen(row.id)"
                    container="body"
                    placement="top"
                    ngbTooltip="Eliminar"
                    ><i size="18" data-feather="trash"></i
                  ></a>
                </div>
              </ng-template>
            </ngx-datatable-column>
          </ngx-datatable>
        </div>
      </section>
    </div>
</div>
<!--Modal importar zonas-->
<ng-template #modalImportar let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Importar zonas</h5>
    <button
        type="button"
        class="close"
        (click)="modal.dismiss('Cross click')"
        aria-label="Close"
    >
        <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body container row" tabindex="0" ngbAutofocus>
    <div class="col-xl-12 col-md-12 col-12">
      <div class="">
        <button class="btn btn-outline-secondary" (click)="formatoXLSX()">Descargar formato</button>
      </div>
      <div class="my-1">
        <!--<label for="formFile" class="form-label">Seleccione algun archivo</label>-->
        <input class="form-control-file"  type="file" id="formFile" (change)="leerArchivo($event)">
        
      </div>

      <button class="btn btn-outline-primary float-left" (click)="importarXLSX()">Importar las zonas</button>
    </div>
    
  </div>
</ng-template>
