<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
      <section class="invoice-add-wrapper">
        <div
        class="mb-1"
        style="color: #e04141; font-weight: 600; font-size: 20px"
      >
        {{accion == 'ver' ? 'Ver' : accion == 'add' ? 'Agregar' : 'Editar'}} provincia
      </div>
        <div class="row invoice-add">
          <!-- Invoice Add Left starts -->
          <div class="col-xl-12 col-md-12 col-12">
            <form
              class="form-horizontal"
              #ProductForm="ngForm"
              (ngSubmit)="onSubmit(ProductForm.form.valid)"
            >
              <div class="card invoice-preview-card">
               
                <div class="m-0 ml-3 mr-3">
                  <div class="row mt-2">
                    <div class="ea">
                      <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input
                          class="form-control"
                          [(ngModel)]="nombre"
                          #nombreRef="ngModel"
                          [disabled]="accion == 'ver'"
                          id="nombre"
                          required
                          name="nombre"
                          (input)="cambioNombreProvincia()"
                        />
                        <span
                          *ngIf="ProductForm.submitted && nombreRef.invalid"
                          class="invalid-form"
                        >
                          <small
                            class="form-text text-danger"
                            *ngIf="nombreRef.errors.required"
                            >Ingrese nombre.</small
                          ></span
                        >
                      </div>
                    </div>
                  </div>
                </div>
                <div *ngIf="accion == 'ver'" class="m-0 ml-3 mr-3">
                  <div class="row mt-1">
                    <div class="col">
                      <h4>Localidades</h4>
                    </div>
                  </div>
                  <div class="row mt-1">
                    <div class="col">
                      
                      <table class="table table-striped">
                        <thead>
                          <tr><th>Nombre</th></tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let locali of rows">
                            <td>
                              {{locali.nombre}}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>        
                <div
                  class="col-12 d-flex flex-sm-row flex-column mt-3 m-6 mb-2 justify-content-end"
                >
                  <button
                    *ngIf="accion!='ver'"
                    type="submit"
                    class="btn btn-primary mb-1 mb-sm-0 mr-0 mr-sm-1"
                    rippleEffect
                  >
                    {{ accion === "add" ? "Guardar" : "Editar" }}
                  </button>

                  <button
                    type=""
                    class="btn btn-outline-secondary mb-1 mb-sm-0 mr-0 mr-sm-1"
                    routerLink="/localidades/listaprovincias"
                    rippleEffect
                  >
                    {{ accion != "ver" ? "Cancelar" : "Atrás" }}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </div>
