<div class="col-lg-6">
    <div class="card">
        <div class="card-body">
            <div class="form-group">
                <input type="file" class="d-none" (change)="onPhotoSelected($event)" #photoInput>
                <img [src]="photoSelected || '../../../assets/images/no-img.png'"
                    onerror="this.src='../../../assets/images/no-img.png';" class="img-fluid" alt="No image"
                    (click)="photoInput.click()">
               
            </div>
            <button class="btn btn-sm btn-outline-secondary mb-0" (click)="onDeletePhoto()"
            rippleEffect>Eliminar</button>
        </div>
        
    </div>
       
    
</div>
